services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: emergensee-facerecognition:prod
    container_name: emergensee_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_NAME=EmergenSee Face Recognition API
      - APP_VERSION=0.1.0
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1
      - MONGO_URI=mongodb://admin:bartar20%40CS@host.docker.internal:21771
    volumes:
      - face_db:/app/face_db
      - model_cache:/app/.model_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  face_db:
    driver: local
  model_cache:
    driver: local
